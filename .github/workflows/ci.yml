name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/prisma/build/index.js generate
      - name: Generate TypeScript client from openapi.yaml
        run: npm run client:gen
      - name: Fail if the committed client is out of date
        run: git diff --exit-code -- clients/typescript
      - name: Typecheck the generated TypeScript client
        run: npm run client:typecheck
      - name: Build, pack, and verify TypeScript client package
        run: |
          npm run client:build
          REPO_ROOT="$(pwd)"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          PACK_DIR="$TMP_DIR/pack"
          APP_DIR="$TMP_DIR/app"
          mkdir -p "$PACK_DIR" "$APP_DIR"
          TARBALL="$(cd clients/typescript && npm pack --pack-destination "$PACK_DIR" | tail -n1)"
          tar -tzf "$PACK_DIR/$TARBALL" | grep -q "^package/dist/index.js$"
          tar -tzf "$PACK_DIR/$TARBALL" | grep -q "^package/dist/index.d.ts$"
          tar -tzf "$PACK_DIR/$TARBALL" | grep -q "^package/README.md$"
          if tar -tzf "$PACK_DIR/$TARBALL" | grep -q "example"; then
            echo "Unexpected example file in tarball"
            exit 1
          fi
          cd "$APP_DIR"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install --no-audit --no-fund "$PACK_DIR/$TARBALL"
          cat <<'EOF' > index.ts
          import { createLensClient } from "@divinity-labs/lens-client";
          const client = createLensClient({ baseUrl: "http://localhost:3002" });
          export const call = () => client.GET("/v1/price/{assetA}/{assetB}", { params: { path: { assetA: "XLM", assetB: "USDC" } } });
          EOF
          "$REPO_ROOT/node_modules/.bin/tsc" --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2022 index.ts
          node -e "import('@divinity-labs/lens-client').then((m) => { if (typeof m.createLensClient !== 'function') process.exit(1); })"
      - name: Fail if the committed README tables are out of date with openapi.yaml
        run: npm run readme:check
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test --if-present

  db-migrations:
    # #233 — schema changes must be reviewable migrations, not `db push`.
    # This job is the authority on drift: it replays every committed migration
    # against a real Postgres and fails if the result disagrees with
    # prisma/schema.prisma. It also proves a new migration can be generated,
    # applied and rolled back on a clean database.
    name: Migration drift & deploy
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: lens
          POSTGRES_PASSWORD: lens
          POSTGRES_DB: lens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lens -d lens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lens:lens@localhost:5432/lens
      DIRECT_DATABASE_URL: postgresql://lens:lens@localhost:5432/lens
      SHADOW_DATABASE_URL: postgresql://lens:lens@localhost:5432/lens_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/prisma/build/index.js generate

      - name: Create empty shadow database
        run: |
          node -e '
            const { Client } = require("pg");
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              await c.query("DROP DATABASE IF EXISTS lens_shadow");
              await c.query("CREATE DATABASE lens_shadow");
              await c.end();
            })();
          '

      - name: Fail on drift between schema.prisma and prisma/migrations
        run: bash scripts/db-drift-check.sh

      - name: Prove generate / apply / rollback on a clean database
        run: bash scripts/db-migration-cycle.sh

      - name: Run the real-Postgres test suites against the migrated database
        # *.pg.test.ts suites are skipped by `npm test` and only run with
        # LENS_DB_TESTS=1 against a throwaway database. This job has one, freshly
        # reset to the committed migrations by the step above.
        env:
          LENS_DB_TESTS: '1'
        run: npx vitest run .pg.test.ts
