services:
  lens:
    build: .
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=postgresql://lens:lens@postgres:5432/lens
      - REDIS_URL=redis://redis:6379
      - WATCHED_PAIRS=XLM:native/USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      # Network this stack ingests (the code defaults to testnet); stated
      # here so a reader can tell which network the stack ingests at a glance.
      - STELLAR_NETWORK=testnet
      - REQUIRE_API_KEY=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /ready, not /status: /status answers as soon as the server listens,
      # before boot finishes; /ready stays unhealthy until markBootComplete()
      # and the Postgres/Redis probes pass (src/health.ts, docs/health.md).
      test: ["CMD", "curl", "-f", "http://localhost:3002/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First-run migrations run before the server can become ready.
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=lens
      - POSTGRES_PASSWORD=lens
      - POSTGRES_DB=lens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lens -d lens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
