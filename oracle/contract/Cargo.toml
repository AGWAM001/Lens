[package]
name = "lens_sep40_oracle"
version = "0.1.0"
edition = "2021"
description = "SEP-40 price feed contract that Lens publishes its aggregate into"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "22"

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
